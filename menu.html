<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Menú...</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; color: #333; padding-bottom: 120px; }
        
        header { background: #2c3e50; color: white; padding: 40px 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        
        .categoria-titulo { margin-top: 30px; color: #e67e22; border-bottom: 2px solid #e67e22; padding-bottom: 5px; text-transform: capitalize; }
        
        /* --- ESTILOS DE TARJETA MEJORADOS (PROFESIONAL) --- */
        .producto-card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column; /* Apila imagen arriba, contenido abajo */
            overflow: hidden; /* Evita que la foto se salga de las esquinas redondas */
            transition: transform 0.2s;
        }
        .producto-card:active { transform: scale(0.98); }

        /* Contenedor de la foto */
        .producto-img {
            width: 100%;
            height: 180px; /* Altura fija para uniformidad */
            background-color: #eee; /* Fondo gris si la imagen tarda en cargar */
            background-size: cover;
            background-position: center;
        }

        /* Contenedor de la información abajo de la foto */
        .producto-contenido {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .info { flex: 1; padding-right: 15px; }
        .info h3 { margin: 0; font-size: 1.2rem; color: #2c3e50; }
        .info p { margin: 5px 0; color: #7f8c8d; font-size: 0.9rem; line-height: 1.4; }
        .precio { font-weight: bold; color: #e67e22; font-size: 1.1rem; display: block; margin-top: 5px; }
        
        .btn-pedir { 
            background: #25d366; color: white; border: none; 
            padding: 10px 20px; border-radius: 50px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 2px 5px rgba(37, 211, 102, 0.3);
            align-self: center; /* Centra el botón verticalmente */
        }
        .btn-pedir:active { background: #128c7e; }

        /* Estilos del carrito mejorado (INTACTOS) */
        .footer-carrito {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 10px;
            box-sizing: border-box; z-index: 100;
        }
        
        .controles-pedido { display: flex; justify-content: space-between; align-items: center; }
        .selector-origen { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; color: #2c3e50; }
        
        /* Modal para número de mesa (INTACTO) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 40% auto; padding: 20px; width: 250px; border-radius: 10px; text-align: center; }
        .modal-content input { width: 80%; padding: 10px; margin: 10px 0; text-align: center; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1 id="nombreRestaurante">Cargando...</h1>
    </header>

    <div class="container" id="listaMenu"></div>

    <!-- Modal para pedir el número de mesa -->
    <div id="modalMesa" class="modal">
        <div class="modal-content">
            <h3>¿En qué mesa estás?</h3>
            <input type="number" id="numMesaInput" placeholder="Ej: 5">
            <button class="btn-pedir" onclick="confirmarMesa()" style="width: 100%; margin-top:10px;">Confirmar</button>
        </div>
    </div>

    <!-- Carrito Flotante Mejorado -->
    <div class="footer-carrito">
        <div class="controles-pedido">
            <span style="font-weight: bold;">Total: <span id="totalVenta" style="color: #e67e22; font-size: 1.2rem;">$0.00</span></span>
            
            <select id="tipoPedido" class="selector-origen" onchange="verificarTipoPedido()">
                <option value="online">🛵 Para Llevar</option>
                <option value="mesa">🍽️ Consumo en Mesa</option>
            </select>
        </div>
        
        <button class="btn-pedir" onclick="procesarPedido()" style="border-radius: 8px;">Enviar Pedido</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5TZ5h2Bpij_EuLJoLWAgKOi4qkAzSVp4",
            authDomain: "pedipro-1853f.firebaseapp.com",
            projectId: "pedipro-1853f",
            storageBucket: "pedipro-1853f.firebasestorage.app",
            messagingSenderId: "346303291186",
            appId: "1:346303291186:web:7b5e06aead830c54e4812b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const idRestaurante = urlParams.get('id');

        let carrito = [];
        let numWhatsApp = "";
        let total = 0;
        let mesaCliente = "";

        async function cargarMenu() {
            if (!idRestaurante) return;

            const restRef = doc(db, "restaurantes", idRestaurante);
            const restSnap = await getDoc(restRef);
            
            if (restSnap.exists()) {
                const data = restSnap.data();
                document.getElementById('nombreRestaurante').innerText = data.nombre;
                document.title = "Menú - " + data.nombre;
                numWhatsApp = data.whatsapp;
            }

            const productosRef = collection(db, "restaurantes", idRestaurante, "productos");
            const querySnapshot = await getDocs(productosRef);
            const contenedor = document.getElementById('listaMenu');
            contenedor.innerHTML = ""; 

            const categorias = {};

            querySnapshot.forEach((doc) => {
                const p = doc.data();
                const cat = p.categoria || "Otros";
                if (!categorias[cat]) categorias[cat] = [];
                categorias[cat].push(p);
            });

            for (const nombreCat in categorias) {
                contenedor.innerHTML += `<h2 class="categoria-titulo">${nombreCat}</h2>`;
                categorias[nombreCat].forEach(p => {
                    
                    // LÓGICA DE IMAGEN: Si el producto tiene el campo 'imagen' y no está vacío, preparamos el div de la foto.
                    let htmlImagen = "";
                    if (p.imagen && p.imagen !== "") {
                        htmlImagen = `<div class="producto-img" style="background-image: url('${p.imagen}');"></div>`;
                    }

                    // Inyectamos la tarjeta completa
                    contenedor.innerHTML += `
                        <div class="producto-card">
                            ${htmlImagen}
                            <div class="producto-contenido">
                                <div class="info">
                                    <h3>${p.nombre}</h3>
                                    <p>${p.descripcion}</p>
                                    <span class="precio">$${p.precio}</span>
                                </div>
                                <button class="btn-pedir" onclick="agregarAlCarrito('${p.nombre}', ${p.precio})">Agregar</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // --- LÓGICA DEL CARRITO Y PEDIDOS INTACTA ---
        window.agregarAlCarrito = function(nombre, precio) {
            carrito.push({ nombre, precio });
            total += precio;
            document.getElementById('totalVenta').innerText = `$${total.toFixed(2)}`;
        }

        window.verificarTipoPedido = function() {
            const tipo = document.getElementById('tipoPedido').value;
            if (tipo === 'mesa') {
                document.getElementById('modalMesa').style.display = 'block';
            } else {
                mesaCliente = "";
            }
        }

        window.confirmarMesa = function() {
            const numero = document.getElementById('numMesaInput').value;
            if (numero) {
                mesaCliente = numero;
                document.getElementById('modalMesa').style.display = 'none';
            } else {
                alert("Por favor, ingresa el número de tu mesa");
            }
        }

        window.procesarPedido = async function() {
            if (carrito.length === 0) return alert("Agrega algo al carrito primero");
            
            const tipo = document.getElementById('tipoPedido').value;
            if (tipo === 'mesa' && mesaCliente === "") {
                return alert("Necesitamos saber tu número de mesa");
            }

            try {
                const btnOriginal = document.querySelector('.footer-carrito .btn-pedir').innerText;
                document.querySelector('.footer-carrito .btn-pedir').innerText = "Procesando...";

                await addDoc(collection(db, "restaurantes", idRestaurante, "pedidos"), {
                    items: carrito,
                    total: total,
                    tipoOrigen: tipo,
                    numeroMesa: mesaCliente,
                    fecha: new Date(),
                    estado: 'pendiente'
                });

                let tituloMensaje = tipo === 'mesa' ? `*Pedido - MESA ${mesaCliente}*` : `*Pedido PARA LLEVAR/ONLINE*`;
                let mensaje = `${tituloMensaje}%0A--------------------------%0A`;
                
                carrito.forEach(item => {
                    mensaje += `- ${item.nombre} ($${item.precio})%0A`;
                });
                mensaje += `--------------------------%0A*Total: $${total.toFixed(2)}*`;

                const url = `https://api.whatsapp.com/send?phone=${numWhatsApp}&text=${mensaje}`;
                
                carrito = [];
                total = 0;
                document.getElementById('totalVenta').innerText = `$0.00`;
                document.querySelector('.footer-carrito .btn-pedir').innerText = btnOriginal;

                window.open(url, '_blank');

            } catch (error) {
                console.error("Error al guardar pedido: ", error);
                alert("Hubo un problema al procesar tu pedido. Intenta de nuevo.");
            }
        }

        cargarMenu();
    </script>
</body>
</html>
