<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de cuenta | PediPro</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; }
        .formulario { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* Estilos para el contenedor del teléfono */
        .telefono-container { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
        .telefono-container select { width: 35%; margin: 0; }
        .telefono-container input { width: 65%; margin: 0; }

        button { width: 100%; min-height: 38px; padding: 9px 12px; margin-top: 10px; background-color: #25d366; color: white; border: 1px solid transparent; border-radius: 7px; font-weight: 750; cursor: pointer; }
        button:hover { background-color: #128c7e; }
        .btn-google { background: #ffffff; color: #1f2937; border: 1px solid #dadce0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f8fafc; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; color: #7f8c8d; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
        
        .mensaje-exito { color: green; text-align: center; font-weight: bold; display: none; }
        
        .link-login { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .link-login a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .link-login a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="formulario">
        <h2>Crea tu cuenta</h2>
        <input type="text" id="nombrePersona" placeholder="Tu nombre">
        <input type="text" id="apellidoPersona" placeholder="Tu apellido">
        
        <!-- Nuevo selector de código internacional -->
        <div class="telefono-container">
            <select id="codigoPais">
                <option value="+52">🇲🇽 +52</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+54">🇦🇷 +54</option>
                <option value="+57">🇨🇴 +57</option>
            </select>
            <input type="tel" id="telefonoWhatsApp" placeholder="WhatsApp (Ej: 9691234567)">
        </div>

        <input type="email" id="correo" placeholder="Tu Correo Electrónico">
        <!-- Campo de contraseña -->
        <input type="password" id="clave" placeholder="Crea una Contraseña">
        
        <button id="btnRegistro">Crear mi cuenta</button>
        <div class="divider">o</div>
        <button id="btnRegistroGoogle" class="btn-google" type="button">Registrarme con Google</button>
        <p id="textoExito" class="mensaje-exito">Cuenta creada con exito. Redirigiendo...</p>

        <!-- Enlace para iniciar sesión -->
        <p class="link-login">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </div>

    <!-- CARGA DE LIBRERÍAS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5TZ5h2Bpij_EuLJoLWAgKOi4qkAzSVp4",
            authDomain: "pedipro-1853f.firebaseapp.com",
            projectId: "pedipro-1853f",
            storageBucket: "pedipro-1853f.firebasestorage.app",
            messagingSenderId: "346303291186",
            appId: "1:346303291186:web:7b5e06aead830c54e4812b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        const SESION_RESTAURANTE_KEY = 'pediproSesionRestaurante';
        const SESION_CERRADA_KEY = 'pediproSesionCerrada';

        function guardarSesionRestaurante(id, usuario = null) {
            if (!id) return;
            localStorage.setItem(SESION_RESTAURANTE_KEY, JSON.stringify({
                id,
                usuario: usuario || { rol: 'administrador', nombre: 'Administrador' },
                ultimoUso: Date.now()
            }));
            localStorage.removeItem(SESION_CERRADA_KEY);
        }

        // --- FUNCIÓN PARA ENCRIPTAR LA CONTRASEÑA (SHA-256) ---
        async function encriptarContrasena(mensaje) {
            const msgBuffer = new TextEncoder().encode(mensaje);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        const btn = document.getElementById('btnRegistro');
        const btnGoogle = document.getElementById('btnRegistroGoogle');

        function separarNombreGoogle(nombreCompleto) {
            const partes = String(nombreCompleto || '').trim().split(/\s+/).filter(Boolean);
            return {
                nombre: partes.shift() || '',
                apellido: partes.join(' ')
            };
        }

        async function buscarRestaurantePorCorreo(correo) {
            const q = query(collection(db, "restaurantes"), where("correo", "==", correo));
            const snap = await getDocs(q);
            return snap.empty ? null : snap.docs[0];
        }

        async function crearCuentaRestaurante({ nombre, apellido, correo, whatsappCompleto, claveEncriptada = null, googleUser = null }) {
            const nombreCompleto = `${nombre} ${apellido}`.trim();
            const nombreNegocioInicial = 'Mi restaurante';
            const docExistente = await buscarRestaurantePorCorreo(correo);
            if (docExistente) {
                if (googleUser?.uid) {
                    await updateDoc(doc(db, "restaurantes", docExistente.id), {
                        googleAuth: true,
                        googleUid: googleUser.uid,
                        authUid: googleUser.uid,
                        firebaseAuthUid: googleUser.uid,
                        provider: 'google',
                        fotoPropietario: googleUser.photoURL || ''
                    });
                }
                guardarSesionRestaurante(docExistente.id, { rol: 'administrador', nombre, apellido, correo });
                window.location.href = "dashboard.html?id=" + docExistente.id;
                return null;
            }

            const payload = {
                nombre: nombreNegocioInicial,
                nombreComercial: nombreNegocioInicial,
                nombrePropietario: nombre,
                apellidoPropietario: apellido,
                propietario: {
                    nombre,
                    apellido,
                    nombreCompleto
                },
                whatsapp: whatsappCompleto,
                correo,
                slug: '',
                fecha: new Date()
            };

            if (claveEncriptada) payload.clave = claveEncriptada;
            if (googleUser) {
                payload.googleAuth = true;
                payload.googleUid = googleUser.uid;
                payload.authUid = googleUser.uid;
                payload.firebaseAuthUid = googleUser.uid;
                payload.provider = 'google';
                payload.fotoPropietario = googleUser.photoURL || '';
            }

            return addDoc(collection(db, "restaurantes"), payload);
        }
        
        btn.addEventListener('click', async () => {
            const nombre = document.getElementById('nombrePersona').value.trim();
            const apellido = document.getElementById('apellidoPersona').value.trim();
            const codigoPais = document.getElementById('codigoPais').value;
            const numeroLocal = document.getElementById('telefonoWhatsApp').value.trim();
            const correo = document.getElementById('correo').value.trim().toLowerCase();
            const claveViva = document.getElementById('clave').value;

            // Validación de campos vacíos
            if (nombre === "" || apellido === "" || numeroLocal === "" || correo === "" || claveViva === "") {
                alert("Por favor, llena todos los campos.");
                return;
            }

            btn.innerText = "Guardando...";
            btn.disabled = true;

            // Unimos el código del país con el número
            const whatsappCompleto = codigoPais + numeroLocal;

            try {
                // Encriptamos la contraseña antes de mandarla a Firebase
                const claveEncriptada = await encriptarContrasena(claveViva);

                const docRef = await crearCuentaRestaurante({ nombre, apellido, correo, whatsappCompleto, claveEncriptada });
                if (!docRef) return;

                document.getElementById('textoExito').style.display = "block";
                guardarSesionRestaurante(docRef.id, { rol: 'administrador', nombre, apellido, correo });
                
                setTimeout(() => {
                    window.location.href = "dashboard.html?id=" + docRef.id;
                }, 1500);

            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar los datos.");
                btn.innerText = "Crear mi cuenta";
                btn.disabled = false;
            }
        });

        btnGoogle.addEventListener('click', async () => {
            const codigoPais = document.getElementById('codigoPais').value;
            const numeroLocal = document.getElementById('telefonoWhatsApp').value.trim();
            if (!numeroLocal) {
                alert("Ingresa tu WhatsApp antes de registrarte con Google.");
                return;
            }

            btnGoogle.innerText = "Conectando con Google...";
            btnGoogle.disabled = true;

            try {
                const resultado = await signInWithPopup(auth, googleProvider);
                const usuarioGoogle = resultado.user;
                const correo = (usuarioGoogle.email || '').trim().toLowerCase();
                if (!correo) throw new Error("Google no devolvio un correo valido.");

                const nombreManual = document.getElementById('nombrePersona').value.trim();
                const apellidoManual = document.getElementById('apellidoPersona').value.trim();
                const desdeGoogle = separarNombreGoogle(usuarioGoogle.displayName);
                const nombre = nombreManual || desdeGoogle.nombre;
                const apellido = apellidoManual || desdeGoogle.apellido;

                if (!nombre || !apellido) {
                    alert("No pudimos obtener tu nombre y apellido desde Google. Llena esos campos y vuelve a intentarlo.");
                    btnGoogle.innerText = "Registrarme con Google";
                    btnGoogle.disabled = false;
                    return;
                }

                const whatsappCompleto = codigoPais + numeroLocal;
                const docRef = await crearCuentaRestaurante({
                    nombre,
                    apellido,
                    correo,
                    whatsappCompleto,
                    googleUser: usuarioGoogle
                });
                if (!docRef) return;

                document.getElementById('textoExito').style.display = "block";
                guardarSesionRestaurante(docRef.id, { rol: 'administrador', nombre, apellido, correo });

                setTimeout(() => {
                    window.location.href = "dashboard.html?id=" + docRef.id;
                }, 1000);
            } catch (error) {
                console.error("Error con Google: ", error);
                alert("No se pudo completar el registro con Google. Verifica que Google este habilitado en Firebase Auth.");
                btnGoogle.innerText = "Registrarme con Google";
                btnGoogle.disabled = false;
            }
        });
    </script>
</body>
</html>
