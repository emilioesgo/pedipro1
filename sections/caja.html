<!-- ============================================================
     SECCIÓN: CAJA POS
     Este archivo es una SECCIÓN del dashboard, no un documento HTML completo.
     Se carga dinámicamente vía fetch() e innerHTML.
============================================================ -->

<style>
  /* ============================================================
     GOOGLE FONTS — cargadas con @import para funcionar en innerHTML
  ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;800&display=swap');

  /* ============================================================
     ROOT VARIABLES — FAST FOOD POS PALETTE
  ============================================================ */
  #vista-caja {
    --bg-root:        #0b0e14;
    --bg-panel:       #111520;
    --bg-card:        #181d2a;
    --bg-input:       #0d1017;
    --border:         #252d3d;
    --border-bright:  #2e3a50;

    --accent:         #f5a623;
    --accent-dim:     #c47f0f;
    --green:          #16c784;
    --green-dim:      #0da066;
    --red:            #e53e3e;
    --red-dim:        #b91c1c;
    --blue:           #3b82f6;

    --text-primary:   #e8edf5;
    --text-secondary: #9aafc8;   /* FIX: más claro que antes (#8899b0) */
    --text-muted:     #6b7c93;   /* FIX: era #4a5568 — casi invisible en fondo oscuro */

    --keypad-bg:      #151b27;
    --keypad-btn:     #1e2638;
    --keypad-hover:   #2a3349;
    --keypad-active:  #f5a623;

    --radius:         8px;
    --radius-lg:      14px;
    --font-ui:        'Barlow Condensed', sans-serif;
    --font-mono:      'Share Tech Mono', monospace;
    --font-label:     'Rajdhani', sans-serif;

    --shadow-glow:    0 0 20px rgba(245,166,35,0.12);
    --shadow-panel:   0 4px 24px rgba(0,0,0,0.5);
  }

  #vista-caja * { box-sizing: border-box; margin: 0; padding: 0; }

  #vista-caja {
    background: var(--bg-root);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    /* Cancelar padding: 32px del .main-content del dashboard */
    margin: -32px;
    width: calc(100% + 64px);
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
  }

  /* FIX: selector acotado a #vista-caja para no afectar otras secciones */
  @media (max-width: 860px) {
    #vista-caja {
      margin: -18px -14px -28px;
      width: calc(100% + 28px);
    }
  }

  /* ============================================================
     VISTA WRAPPER — FIX: acotado a #vista-caja para no romper otras secciones
  ============================================================ */
  #vista-caja.vista { width: 100%; min-height: 100vh; padding: 0; }

  /* ============================================================
     POS CONTAINER
  ============================================================ */
  .pos-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 64px);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 900px) {
    .pos-container {
      height: auto;
      min-height: 0;
      overflow: visible;
    }
    #vista-caja {
      overflow-y: auto;
    }
  }

  /* Ambient grid scoped to pos-container */
  .pos-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,166,35,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,166,35,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* ============================================================
     STATUS BAR — TOP RIBBON
  ============================================================ */
  .pos-status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 64px;
    background: var(--bg-panel);
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 2px 16px rgba(245,166,35,0.18);
    flex-shrink: 0;
    gap: 16px;
    position: relative;
    z-index: 10;
  }

  .pos-status-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(245,166,35,0.06) 0%, transparent 40%);
    pointer-events: none;
  }

  .pos-cashier-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 180px;
  }

  .status-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-muted);
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 0 3px rgba(100,116,139,0.2);
    flex-shrink: 0;
    transition: all 0.3s ease;
  }

  .status-indicator.active {
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(22,199,132,0.25), 0 0 12px rgba(22,199,132,0.5);
    animation: pulse-green 2s infinite;
  }

  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 0 3px rgba(22,199,132,0.25), 0 0 12px rgba(22,199,132,0.4); }
    50%       { box-shadow: 0 0 0 6px rgba(22,199,132,0.1),  0 0 20px rgba(22,199,132,0.6); }
  }

  .pos-clock {
    font-family: var(--font-mono);
    font-size: 2rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(245,166,35,0.4);
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .pos-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .pos-btn {
    font-family: var(--font-ui);
    font-size: 0.78rem;
    font-weight: 750;
    letter-spacing: 0.35px;
    text-transform: uppercase;
    min-height: 36px;
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
    box-shadow: none;
  }

  .btn-turno {
    background: #16a34a;
    color: #fff;
  }
  .btn-turno:hover { transform: translateY(-1px); background: #15803d; }

  .btn-turno-off {
    background: #dc2626;
    color: #fff;
  }
  .btn-turno-off:hover { transform: translateY(-1px); background: #b91c1c; }

  .btn-corte {
    background: var(--bg-card);
    color: var(--accent);
    border-color: rgba(245,166,35,0.55);
  }
  .btn-corte:hover { background: rgba(245,166,35,0.1); transform: translateY(-1px); }

  /* ============================================================
     MAIN LAYOUT
  ============================================================ */
  .pos-main-layout {
    display: grid;
    grid-template-columns: 1fr 420px;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* ============================================================
     LEFT PANEL — PENDING ORDERS
  ============================================================ */
  .pos-left-panel {
    background: var(--bg-card);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-bright);
  }

  .panel-header h3 {
    font-family: var(--font-ui);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  .panel-header p {
    font-family: var(--font-label);
    font-size: 0.78rem;
    color: var(--text-secondary); /* FIX: era var(--text-muted) — casi invisible */
    letter-spacing: 0.5px;
    margin-top: 3px !important;
  }

  .badge-count {
    background: var(--accent);
    color: #000;
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 700;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px rgba(245,166,35,0.4);
    flex-shrink: 0;
  }

  /* FIX: buscador con tema oscuro — elimina el parche blanco */
  #posSearchOrder {
    width: 100%;
    padding: 11px 16px;
    background: var(--bg-input);
    border: 1.5px solid var(--border-bright);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-label);
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.2s;
  }
  #posSearchOrder::placeholder { color: var(--text-muted); }
  #posSearchOrder:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }

  /* FIX: override del wrapper inline del buscador (background: #f8fafc) */
  .pos-left-panel > div[style*="padding: 12px"],
  .pos-search-wrapper {
    padding: 12px 16px !important;
    background: var(--bg-panel) !important;
    border-bottom: 1px solid var(--border) !important;
  }

  /* Scroll area */
  .pos-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
  }
  .pos-scroll-area::-webkit-scrollbar { width: 4px; }
  .pos-scroll-area::-webkit-scrollbar-track { background: transparent; }
  .pos-scroll-area::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }

  .pos-empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 180px;
    color: var(--text-secondary); /* FIX: era var(--text-muted) — más visible */
    font-family: var(--font-label);
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    border: 2px dashed var(--border-bright); /* FIX: border más visible */
    border-radius: var(--radius-lg);
    margin: 12px;
    text-align: center;
    padding: 20px;
  }

  /* ============================================================
     RIGHT PANEL — COBRO / TICKET
  ============================================================ */
  .pos-right-panel {
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 2px solid var(--border);
    transition: opacity 0.3s ease;
    position: relative;
  }

  .pos-right-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--green), var(--blue));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .pos-right-panel:not([style*="opacity: 0.5"])::before { opacity: 1; }

  /* ---- TICKET HEADER ---- */
  .ticket-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-bright);
  }

  .ticket-header h3 {
    font-family: var(--font-ui);
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  #txtFolioTicket {
    font-family: var(--font-mono);
    font-size: 1.2rem;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(245,166,35,0.4);
    letter-spacing: 1px;
  }

  /* ---- TICKET BODY ---- */
  .ticket-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
  }

  .ticket-items {
    padding: 12px 16px;
    min-height: 80px;
  }

  .ticket-items > * {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-label);
    font-size: 0.95rem;
    color: var(--text-primary);
  }

  /* ---- TICKET SUMMARY ---- */
  .ticket-summary {
    padding: 12px 16px;
    border-top: 1px solid var(--border-bright);
    background: var(--bg-card);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-family: var(--font-label);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: var(--text-primary);
  }

  .summary-row.total {
    margin-top: 8px;
    padding-top: 12px;
    border-top: 2px solid var(--border-bright);
    font-family: var(--font-ui);
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  .summary-row.total span:last-child {
    font-family: var(--font-mono);
    font-size: 1.7rem;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(245,166,35,0.4);
  }

  /* ---- PAYMENT SECTION ---- */
  .pos-payment-section {
    padding: 16px;
    background: var(--bg-card);
    border-top: 2px solid var(--border-bright);
    flex-shrink: 0;
  }

  .pos-payment-section > label {
    display: block;
    font-family: var(--font-ui);
    font-size: 0.78rem;  /* FIX: un poco más grande para legibilidad */
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary); /* FIX: era var(--text-muted) */
    margin-bottom: 10px;
  }

  /* Payment method grid */
  .payment-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .pay-method-btn {
    background: var(--bg-input);
    border: 1px solid var(--border-bright);
    border-radius: 7px;
    color: var(--text-secondary);
    min-height: 42px;
    padding: 9px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-family: var(--font-ui);
    font-size: 0.78rem;
    font-weight: 750;
    letter-spacing: 0.35px;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }

  .pay-method-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(245,166,35,0.06);
    transform: translateY(-1px);
    box-shadow: none;
  }

  .pay-method-btn.active,
  .pay-method-btn.selected {
    border-color: var(--accent);
    background: rgba(245,166,35,0.12);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(245,166,35,0.28);
  }

  /* ---- CASH SUB-PANEL ---- */
  .cobro-subpanel {
    margin-bottom: 12px;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .received-input-wrap > label {
    display: block;
    font-family: var(--font-ui);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary); /* FIX: era var(--text-muted) */
    margin-bottom: 6px;
  }

  .pos-amount-display {
    background: var(--bg-input);
    border: 2px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: 2rem;
    letter-spacing: 2px;
    color: var(--text-primary);
    text-align: right;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }

  .pos-amount-display:focus-within,
  .pos-amount-display:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.1);
  }

  /* Numeric Keypad */
  .pos-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }

  .pos-keypad button {
    background: var(--keypad-btn);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 700;
    padding: 14px 8px;
    cursor: pointer;
    transition: all 0.1s ease;
    letter-spacing: 1px;
  }

  .pos-keypad button:hover {
    background: var(--keypad-hover);
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(0.97);
  }

  .pos-keypad button:active {
    background: var(--accent);
    color: #000;
    transform: scale(0.94);
    box-shadow: 0 0 16px rgba(245,166,35,0.5);
  }

  .pos-keypad .btn-clear {
    background: rgba(229,62,62,0.12);
    border-color: rgba(229,62,62,0.4);
    color: #e53e3e;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
  }

  .pos-keypad .btn-clear:hover {
    background: rgba(229,62,62,0.2);
    border-color: var(--red);
    color: var(--red);
  }

  .pos-keypad .btn-clear:active {
    background: var(--red);
    color: #fff;
  }

  /* Change display */
  .change-display {
    background: linear-gradient(135deg, #0f1a2b, #0d1420);
    border: 1.5px solid var(--border-bright);
    border-left: 4px solid var(--green);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-family: var(--font-ui);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary); /* FIX: era var(--text-secondary) ya estaba bien */
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #posCambioDisplay {
    font-family: var(--font-mono) !important;
    font-size: 1.5rem !important;
    color: var(--green) !important;
    text-shadow: 0 0 16px rgba(22,199,132,0.5) !important;
  }

  /* Voucher/Transfer input */
  .pos-input {
    width: 100%;
    padding: 11px 16px;
    background: var(--bg-input);
    border: 1.5px solid var(--border-bright);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 1rem;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 6px;
  }

  .pos-input::placeholder { color: var(--text-muted); font-family: var(--font-label); letter-spacing: 0.5px; }
  .pos-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

  #panelCobroTarjeta > label {
    display: block;
    font-family: var(--font-ui);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary); /* FIX: era var(--text-muted) */
    margin-bottom: 8px;
  }

  #panelCobroTarjeta p {
    font-size: 0.72rem !important;
    color: var(--text-secondary) !important; /* FIX: era var(--text-muted) */
    font-family: var(--font-label) !important;
  }

  /* ---- FINAL ACTION BUTTONS ---- */
  .pos-final-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1.6fr;
    gap: 10px;
    margin-top: 12px;
  }

  .btn-cancel-pos {
    background: rgba(229,62,62,0.1);
    border: 1px solid rgba(229,62,62,0.4);
    border-radius: 7px;
    color: var(--red);
    font-family: var(--font-ui);
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    min-height: 40px;
    padding: 10px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-cancel-pos:hover {
    background: rgba(229,62,62,0.2);
    border-color: var(--red);
    transform: translateY(-1px);
  }

  .btn-print-ticket-pos {
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.45);
    border-radius: 7px;
    color: #93c5fd;
    font-family: var(--font-ui);
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    min-height: 40px;
    padding: 10px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-print-ticket-pos:hover {
    background: rgba(59,130,246,0.2);
    border-color: var(--blue);
    color: #bfdbfe;
    transform: translateY(-1px);
  }

  .btn-charge-pos {
    background: #16a34a;
    border: 1px solid #16a34a;
    border-radius: 7px;
    color: #fff;
    font-family: var(--font-ui);
    font-size: 0.92rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    min-height: 42px;
    padding: 11px 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: none;
    position: relative;
    overflow: hidden;
  }

  .btn-charge-pos::after {
    content: none;
  }

  .btn-charge-pos:hover {
    background: #15803d;
    border-color: #15803d;
    transform: translateY(-1px);
    box-shadow: none;
  }

  .btn-charge-pos:active {
    transform: translateY(0px) scale(0.98);
  }

  /* ============================================================
     CASHIER NAME
  ============================================================ */
  #txtCajeroActual {
    font-family: var(--font-ui) !important;
    font-size: 1.05rem !important;
    font-weight: 700 !important;
    letter-spacing: 0.5px !important;
    color: var(--text-primary) !important;
  }

  .pos-cashier-info > div span:first-child {
    font-size: 0.65rem !important;
    color: var(--text-secondary) !important; /* FIX: era var(--text-muted) */
    text-transform: uppercase !important;
    letter-spacing: 1.5px !important;
    font-family: var(--font-label) !important;
  }

  /* ============================================================
     TICKET AMOUNTS
  ============================================================ */
  #txtTicketSubtotal, #txtTicketTotal {
    font-family: var(--font-mono);
    font-size: 1rem;
    letter-spacing: 0.5px;
  }

<div id="vista-caja" class="vista">
    <div class="pos-container">
        <!-- BARRA SUPERIOR DE ESTADO -->
        <div class="pos-status-bar">
            <div class="pos-cashier-info">
                <div class="status-indicator" id="posStatusIndicator"></div>
                <div style="display:flex; flex-direction:column;">
                    <span style="font-size:0.7rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px;">Cajero Activo</span>
                    <span id="txtCajeroActual" style="font-size:1.1rem;">Ninguno</span>
                </div>
            </div>
            <div class="pos-clock" id="posClock">00:00:00</div>
            <div class="pos-actions">
                <button class="pos-btn btn-turno" id="btnIniciarTurno" onclick="iniciarTurnoCaja()">
                    <span>🟢</span> Iniciar Turno
                </button>
                <button class="pos-btn btn-turno-off" id="btnFinalizarTurno" onclick="finalizarTurnoCaja()" style="display:none;">
                    <span>🔴</span> Finalizar Turno
                </button>
                <button class="pos-btn btn-corte" onclick="document.getElementById('modalCorteCaja').style.display='block'">
                    <span>📊</span> Corte de Caja
                </button>
            </div>
        </div>

        <div class="pos-main-layout">
            <!-- COLUMNA IZQUIERDA: COMANDAS PENDIENTES -->
            <div class="pos-left-panel">
                <div class="panel-header">
                    <div>
                        <h3 style="margin:0;">📥 Comandas Pendientes</h3>
                        <p style="margin:4px 0 0; font-size:0.8rem; color:var(--text-secondary);">Turno actual en curso</p>
                    </div>
                    <span class="badge-count" id="countPendientes">0</span>
                </div>

                <!-- FIX: se eliminan colores inline claros; el CSS ya aplica el tema oscuro -->
                <div class="pos-search-wrapper">
                    <input type="text" id="posSearchOrder" placeholder="🔍 Buscar por folio o cliente..."
                           onkeyup="window.filtrarCaja()">
                </div>

                <div class="pos-scroll-area" id="tbody-caja-pendientes">
                    <div class="pos-empty-state">Inicia turno para ver las comandas pendientes</div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: COBRO ACTUAL -->
            <div class="pos-right-panel" id="posCobroPanel" style="opacity: 0.5; pointer-events: none;">
                <div class="ticket-header">
                    <h3>DETALLE DE VENTA</h3>
                    <span id="txtFolioTicket">#0000-00</span>
                </div>

                <div class="ticket-body">
                    <div class="ticket-items" id="ticketItemsList"></div>

                    <div class="ticket-summary">
                        <div class="summary-row">
                            <span>Subtotal Bruto</span>
                            <span id="txtTicketSubtotal">$0.00</span>
                        </div>
                        <div class="summary-row" style="color:#10b981;">
                            <span>Impuestos (Incluidos)</span>
                            <span>$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>TOTAL</span>
                            <span id="txtTicketTotal">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="pos-payment-section">
                    <label>Seleccione Método de Pago</label>
                    <div class="payment-grid">
                        <button class="pay-method-btn" data-method="Efectivo" onclick="seleccionarMetodoCobro('Efectivo')">
                            <span style="font-size:1.5rem;">💵</span>
                            <span>Efectivo</span>
                        </button>
                        <button class="pay-method-btn" data-method="Tarjeta" onclick="seleccionarMetodoCobro('Tarjeta')">
                            <span style="font-size:1.5rem;">💳</span>
                            <span>Tarjeta</span>
                        </button>
                        <button class="pay-method-btn" data-method="Transferencia" onclick="seleccionarMetodoCobro('Transferencia')">
                            <span style="font-size:1.5rem;">🏦</span>
                            <span>Transf.</span>
                        </button>
                    </div>

                    <div id="panelCobroEfectivo" class="cobro-subpanel" style="display:none;">
                        <div class="received-input-wrap">
                            <label>Efectivo Recibido</label>
                            <div class="pos-amount-display">$<span id="posRecibidoDisplay">0</span></div>
                        </div>

                        <div class="pos-keypad">
                            <button onclick="tecladoPOS('7')">7</button>
                            <button onclick="tecladoPOS('8')">8</button>
                            <button onclick="tecladoPOS('9')">9</button>
                            <button onclick="tecladoPOS('4')">4</button>
                            <button onclick="tecladoPOS('5')">5</button>
                            <button onclick="tecladoPOS('6')">6</button>
                            <button onclick="tecladoPOS('1')">1</button>
                            <button onclick="tecladoPOS('2')">2</button>
                            <button onclick="tecladoPOS('3')">3</button>
                            <button onclick="tecladoPOS('0')">0</button>
                            <button onclick="tecladoPOS('00')">00</button>
                            <button class="btn-clear" onclick="tecladoPOS('clear')">CLEAR</button>
                        </div>

                        <div class="change-display">
                            CAMBIO A ENTREGAR: <span id="posCambioDisplay" style="color:var(--green); font-size:1.4rem;">$0.00</span>
                        </div>
                    </div>

                    <div id="panelCobroTarjeta" class="cobro-subpanel" style="display:none;">
                        <label>Referencia Bancaria (Folio/Voucher)</label>
                        <input type="text" id="posVoucherRef" placeholder="Ej: 000123" class="pos-input">
                        <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:8px;">* Requerido para arqueo de caja con vouchers físicos</p>
                    </div>

                    <div class="pos-final-actions">
                        <button class="btn-cancel-pos" onclick="cancelarSeleccionCaja()">CANCELAR</button>
                        <button class="btn-print-ticket-pos" onclick="imprimirTicketCaja()">IMPRIMIR TICKET</button>
                        <button class="btn-charge-pos" id="btnFinalizarCobroPOS" onclick="finalizarCobroPOS()">COBRAR AHORA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
