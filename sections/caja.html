<div id="vista-caja" class="vista">
    <div class="pos-container">
        <!-- BARRA SUPERIOR DE ESTADO PREMIUM -->
        <div class="pos-status-bar">
            <div class="pos-cashier-info">
                <div class="status-indicator" id="posStatusIndicator"></div>
                <div style="display:flex; flex-direction:column;">
                    <span style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase; letter-spacing:1px;">Cajero Activo</span>
                    <span id="txtCajeroActual" style="font-size:1.1rem;">Ninguno</span>
                </div>
            </div>
            <div class="pos-clock" id="posClock">00:00:00</div>
            <div class="pos-actions">
                <button class="pos-btn btn-turno" id="btnIniciarTurno" onclick="iniciarTurnoCaja()">
                    <span>🟢</span> Iniciar Turno
                </button>
                <button class="pos-btn btn-turno-off" id="btnFinalizarTurno" onclick="finalizarTurnoCaja()" style="display:none;">
                    <span>🔴</span> Finalizar Turno
                </button>
                <button class="pos-btn btn-corte" onclick="document.getElementById('modalCorteCaja').style.display='block'">
                    <span>📊</span> Corte de Caja
                </button>
            </div>
        </div>

        <div class="pos-main-layout">
            <!-- COLUMNA IZQUIERDA: COMANDAS PENDIENTES CON FILTROS -->
            <div class="pos-left-panel">
                <div class="panel-header">
                    <div>
                        <h3 style="margin:0;">📥 Comandas Pendientes</h3>
                        <p style="margin:4px 0 0; font-size:0.8rem; color:#64748b;">Turno actual en curso</p>
                    </div>
                    <span class="badge-count" id="countPendientes">0</span>
                </div>
                
                <div style="padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                    <input type="text" id="posSearchOrder" placeholder="🔍 Buscar por folio o cliente..." 
                           style="width:100%; padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; font-size:0.9rem;"
                           onkeyup="window.filtrarCaja()">
                </div>

                <div class="pos-scroll-area" id="tbody-caja-pendientes">
                    <!-- Cargando dinámicamente -->
                    <div class="pos-empty-state">Inicia turno para ver las comandas pendientes</div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: COBRO ACTUAL (ESTILO TICKET PREMIUM) -->
            <div class="pos-right-panel" id="posCobroPanel" style="opacity: 0.5; pointer-events: none;">
                <div class="ticket-header">
                    <h3>DETALLE DE VENTA</h3>
                    <span id="txtFolioTicket">#0000-00</span>
                </div>
                
                <div class="ticket-body">
                    <div class="ticket-items" id="ticketItemsList">
                        <!-- Items del pedido con animaciones -->
                    </div>
                    
                    <div class="ticket-summary">
                        <div class="summary-row">
                            <span>Subtotal Bruto</span>
                            <span id="txtTicketSubtotal">$0.00</span>
                        </div>
                        <div class="summary-row" style="color:#10b981;">
                            <span>Impuestos (Incluidos)</span>
                            <span>$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>TOTAL</span>
                            <span id="txtTicketTotal">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="pos-payment-section">
                    <label>Seleccione Método de Pago</label>
                    <div class="payment-grid">
                        <button class="pay-method-btn" data-method="Efectivo" onclick="seleccionarMetodoCobro('Efectivo')">
                            <span style="font-size:1.5rem;">💵</span>
                            <span>Efectivo</span>
                        </button>
                        <button class="pay-method-btn" data-method="Tarjeta" onclick="seleccionarMetodoCobro('Tarjeta')">
                            <span style="font-size:1.5rem;">💳</span>
                            <span>Tarjeta</span>
                        </button>
                        <button class="pay-method-btn" data-method="Transferencia" onclick="seleccionarMetodoCobro('Transferencia')">
                            <span style="font-size:1.5rem;">🏦</span>
                            <span>Transf.</span>
                        </button>
                    </div>

                    <div id="panelCobroEfectivo" class="cobro-subpanel" style="display:none;">
                        <div class="received-input-wrap">
                            <label>Efectivo Recibido</label>
                            <div class="pos-amount-display">$<span id="posRecibidoDisplay">0</span></div>
                        </div>
                        
                        <div class="pos-keypad">
                            <button onclick="tecladoPOS('7')">7</button>
                            <button onclick="tecladoPOS('8')">8</button>
                            <button onclick="tecladoPOS('9')">9</button>
                            <button onclick="tecladoPOS('4')">4</button>
                            <button onclick="tecladoPOS('5')">5</button>
                            <button onclick="tecladoPOS('6')">6</button>
                            <button onclick="tecladoPOS('1')">1</button>
                            <button onclick="tecladoPOS('2')">2</button>
                            <button onclick="tecladoPOS('3')">3</button>
                            <button onclick="tecladoPOS('0')">0</button>
                            <button onclick="tecladoPOS('00')">00</button>
                            <button class="btn-clear" onclick="tecladoPOS('clear')">CLEAR</button>
                        </div>

                        <div class="change-display">
                            CAMBIO A ENTREGAR: <span id="posCambioDisplay" style="color:#fff; font-size:1.4rem;">$0.00</span>
                        </div>
                    </div>

                    <div id="panelCobroTarjeta" class="cobro-subpanel" style="display:none;">
                        <label>Referencia Bancaria (Folio/Voucher)</label>
                        <input type="text" id="posVoucherRef" placeholder="Ej: 000123" class="pos-input">
                        <p style="font-size:0.75rem; color:#94a3b8; margin-top:8px;">* Requerido para arqueo de caja con vouchers físicos</p>
                    </div>

                    <div class="pos-final-actions">
                        <button class="btn-cancel-pos" onclick="cancelarSeleccionCaja()">CANCELAR</button>
                        <button class="btn-charge-pos" id="btnFinalizarCobroPOS" onclick="finalizarCobroPOS()">COBRAR AHORA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
